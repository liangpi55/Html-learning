<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合并单元格</title>
</head>
<body>
    <table border="1">
        <!-- 第一行 -->
        <tr>
            <th>姓名</th>
            <th>语文</th>
            <th>数学</th>
            <th>总分</th>
        </tr>
        <!-- 第二行 -->
        <tr>
            <td>张三</td>
            <td>99</td>
            <td>98</td>
            <td  rowspan="2">99</td>
        </tr>
        <!-- 第三行 -->
        <tr>
            <td>李四</td>
            <td>98</td>
            <td>98</td>
            <!-- <td>97</td> -->
        </tr>
        <!-- 第四行 -->
        <tr>
            <td>总评</td>
            <td colspan="3">年级第一</td>
            <!-- <td>年级第一</td> -->
            <!-- <td>年级第一</td> -->
        </tr>
    </table>
<!-- 当然你也可以这样 -->
 <!-- 原则就是保留最左最上，删去被覆盖的值 -->
    <table border="1">
        <!-- 第一行 -->
        <tr>
            <th>姓名</th>
            <th>语文</th>
            <th>数学</th>
            <th>总分</th>
        </tr>
        <!-- 第二行 -->
        <tr>
            <td>张三</td>
            <td colspan="2" rowspan="2">99</td>
            <!-- <td>98</td> -->
            <td>99</td>
        </tr>
        <!-- 第三行 -->
        <tr>
            <td>李四</td>
            <!-- <td>98</td> -->
            <!-- <td>98</td> -->
            <td>97</td>
        </tr>
        <!-- 第四行 -->
        <tr>
            <td>总评</td>
            <td >年级第一</td>
            <td>年级第一</td>
            <td>年级第一</td>
        </tr>
    </table>
</body>
</html>
<!-- table嵌套tr,th为title head,td为title date -->
