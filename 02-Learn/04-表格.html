<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格的使用</title>
</head>
<body>
    <table border="1">
        <td>121</td>
        <tr>
            <th>第一列</th>
            <th>第二列</th>
            <th>第三列</th>
            <th>第四列</th>
        </tr>
        
        <tr>
            <td>重庆大学</td>
            <td>清华大学</td>
            <td>厦门大学</td>
            <td>北京大学</td>
            <td>这是额外的一格</td>
        </tr>
        
        <tr>
            <td>重新再来</td>
        </tr>
    </table>

    <table border="1">
        <tr>
            <th>姓名</th>
            <th>语文</th>
            <th>数学</th>
            <th>总分</th>
        </tr>

        <tr>
            <td>张三</td>
            <td>99</td>
            <td>98</td>
            <td>99</td>
        </tr>

        <tr>
            <td>李四</td>
            <td>98</td>
            <td>99</td>
            <td>97</td>
        </tr>

        <tr>
            <td>总评</td>
            <td>年级第一</td>
            <td>年级第一</td>
            <td>年级第一</td>
        </tr>
    </table>
</body>
</html>
<!-- table嵌套tr,th为title head,td为title date -->
