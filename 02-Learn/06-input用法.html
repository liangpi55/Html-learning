<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 兴致勃勃地打了好多，>_<开心 -->
    文本框：<input type="text" placeholder="请输入姓名"><br><br>

    密码框：<input type="password" placeholder="请输入密码"><br><br>

    单选框：<input type="radio"><br><br>

    多选框：<input type="checkbox"><br><br>

    文件选择：<input type="file"><br><br>

    进度条：<input type="range"><br><br>

    重置框：<input type="reset"><br><br>

    依旧文本框：<input type="tel"><br><br>

    时间框：<input type="time"><br><br>

    年月日：<input type="datetime-local"><br><br>

    周：<input type="week" name="" id=""><br><br>

    图片（？）：<input type="image"><br><br>

    按钮：<input type="button" value="0"><br><br>

    自选颜色：<input type="color" aria-colspan="1"><br><br>

    隐藏（？）<input type="hidden" name=""><br><br>

</body>
</html>
