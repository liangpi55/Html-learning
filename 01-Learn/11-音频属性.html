<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- HTML5中，属性名和属性值一致可以简写为属性名 -->
     <!-- controls显示音频控制面板 -->
    <!-- loop循环播放 -->
    <!-- autoplay自动播放，但浏览器禁用 -->
    <audio src="./反方向的钟.mp3" controls loop autoplay></audio>
</body>
</html>
