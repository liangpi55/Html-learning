<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <b>b 加粗</b><br>
    <strong>strong 加粗</strong><br>

    <i>i 斜体</i><br>
    <em>em 斜体</em><br>

    <u>u 下划线</u><br>
    <ins>ins下划线</ins><br>

    <s>s删除</s><br>
    <del>sel删除</del><br>

    <main>原神启动</main>
    <main><b><em><s><ins>神秘答案</ins></s></em></b></main>
</body>
</html>
<!-- 小发现：<main></main>可以实现自动前后换行 -->
 <!-- strong加粗em斜体ins下划线del删除 -->
